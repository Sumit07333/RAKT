version: '3.8'

services:
  # RaktNavi Frontend (React + Vite + Nginx)
  raktnavi-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: raktnavi-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_DEMO_MODE=true
    restart: unless-stopped
    depends_on:
      - raktnavi-backend

  # Future FastAPI Backend
  raktnavi-backend:
    image: python:3.11-slim
    container_name: raktnavi-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql+psycopg://raktnavi_user:raktnavi_pass@postgres-db:5432/raktnavi_db
      - REDIS_URL=redis://redis-cache:6379/0
      - ENVIRONMENT=development
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    depends_on:
      - postgres-db
      - redis-cache

  # PostgreSQL Relational Database
  postgres-db:
    image: postgres:15-alpine
    container_name: raktnavi-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=raktnavi_user
      - POSTGRES_PASSWORD=raktnavi_pass
      - POSTGRES_DB=raktnavi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/seed_demo_data.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Redis for Session & Freshness Caching
  redis-cache:
    image: redis:7-alpine
    container_name: raktnavi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
